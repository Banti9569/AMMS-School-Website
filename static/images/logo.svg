<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132"/>
      <stop offset="100%" stop-color="#06321d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="94" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(253, 211, 77, 0.4)" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Laurel Leaves (Left & Right) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Left Wreath Leaves -->
    <path d="M 40 100 C 35 85 45 70 52 65 C 50 75 45 85 40 100 Z"/>
    <path d="M 42 115 C 34 105 40 90 48 88 C 45 98 42 108 42 115 Z"/>
    <path d="M 48 130 C 40 125 42 110 52 110 C 48 120 48 126 48 130 Z"/>
    <path d="M 60 145 C 50 140 50 128 62 128 C 58 138 60 142 60 145 Z"/>

    <!-- Right Wreath Leaves -->
    <path d="M 160 100 C 165 85 155 70 148 65 C 150 75 155 85 160 100 Z"/>
    <path d="M 158 115 C 166 105 160 90 152 88 C 155 98 158 108 158 115 Z"/>
    <path d="M 152 130 C 160 125 158 110 148 110 C 152 120 152 126 152 130 Z"/>
    <path d="M 140 145 C 150 140 150 128 138 128 C 142 138 140 142 140 145 Z"/>
  </g>

  <!-- Sun Rays Behind Book -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.6">
    <line x1="100" y1="58" x2="100" y2="44"/>
    <line x1="88" y1="62" x2="78" y2="52"/>
    <line x1="112" y1="62" x2="122" y2="52"/>
    <line x1="78" y1="72" x2="66" y2="66"/>
    <line x1="122" y1="72" x2="134" y2="66"/>
  </g>

  <!-- Shining Knowledge Star / Crescent Top Motif -->
  <circle cx="100" cy="52" r="5" fill="#fcd34d"/>

  <!-- Open Book Symbol -->
  <g id="book">
    <!-- Left Page -->
    <path d="M 100 112 C 85 106 65 108 58 114 L 58 84 C 65 78 85 76 100 82 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Right Page -->
    <path d="M 100 112 C 115 106 135 108 142 114 L 142 84 C 135 78 115 76 100 82 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Book Spine & Details -->
    <path d="M 100 82 L 100 114" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Page Lines Left -->
    <line x1="68" y1="88" x2="92" y2="85" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="66" y1="94" x2="92" y2="91" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="68" y1="100" x2="90" y2="97" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Page Lines Right -->
    <line x1="108" y1="85" x2="132" y2="88" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="108" y1="91" x2="134" y2="94" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="110" y1="97" x2="132" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Torch / Flame on Top of Book -->
  <path d="M 100 68 C 96 73 97 78 100 81 C 103 78 104 73 100 68 Z" fill="#ef4444"/>
  <path d="M 100 72 C 98 75 99 78 100 80 C 101 78 102 75 100 72 Z" fill="#f59e0b"/>

  <!-- Ribbon at bottom -->
  <path d="M 50 148 L 70 142 L 100 145 L 130 142 L 150 148 L 140 156 L 100 153 L 60 156 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="100" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#06321d" text-anchor="middle" letter-spacing="1.2">ESTD. 2012</text>

  <!-- School Name Arc or Text -->
  <text x="100" y="174" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">HAZIPUR, W.B. 731245</text>
  <text x="100" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#fcd34d" text-anchor="middle" letter-spacing="1.5">AL MAJID MISSION</text>
</svg>
