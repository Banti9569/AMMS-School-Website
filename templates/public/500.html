{% extends "base.html" %}

{% block title %}System Error (500) | Al Majid Mission School{% endblock %}

{% block content %}
<div class="container" style="padding:4rem 1rem; text-align:center;">
  <div style="font-size:4rem; margin-bottom:1rem;">⚠️ 500</div>
  <h1 style="color:var(--primary); font-size:2rem; margin-bottom:0.75rem;">Internal Server Error</h1>

  <a href="{{ url_for('public.home') }}" class="btn btn-primary">Return to School Home</a>

{% endblock %}
