{% extends "base.html" %}

{% block title %}Access Denied (403) | Al Majid Mission School{% endblock %}

{% block content %}
<div class="container" style="padding:4rem 1rem; text-align:center;">
  <div style="font-size:4rem; margin-bottom:1rem;">🔒 403</div>
  <h1 style="color:var(--primary); font-size:2rem; margin-bottom:0.75rem;">Access Restricted</h1>
  <p style="color:var(--text-muted); max-width:500px; margin:0 auto 1.5rem; font-size:1rem;">
    You do not have permission to access this page. Please log in with appropriate parent or administrator credentials.
  </p>
  <div style="display:flex; gap:0.5rem; justify-content:center;">
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Log In</a>
    <a href="{{ url_for('public.home') }}" class="btn btn-secondary">Home Page</a>
  </div>
</div>
{% endblock %}
